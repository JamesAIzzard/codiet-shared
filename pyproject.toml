[project]
name = "codiet-shared"
version = "0.1.0"
description = "Shared protocols and exceptions for codiet projects"
authors = [
    {name = "James Izzard", email = "jamesaizzard@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "pygraph",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codiet_shared"]

[tool.uv.sources]
pygraph = { workspace = true }

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
